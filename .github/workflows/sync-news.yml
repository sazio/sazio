name: Sync news and stats

# Pulls the latest news from https://sazio.github.io (assets/home/data.js) into README.md and,
# when the STATS_TOKEN secret is set, regenerates the activity card (assets/stats-*.svg).
on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_news.py
      # Skipped without the secret: the default token sees public repos only and would undercount.
      - name: Refresh activity card
        if: env.STATS_TOKEN != ''
        run: python scripts/make_stats.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync news and stats"
          git push
